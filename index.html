<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>애니버서리 캘린더 — 라프텔</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --laftel: #816BFF;
      --laftel-light: #F0EEFF;
      --laftel-mid: #C4BAFF;
      --laftel-dark: #5040CC;
      --laftel-text: #3B2DA8;
      --bg: #32322e;
      --surface: #3e3e39;
      --border: rgba(249,246,233,0.12);
      --text-primary: #f9f6e9;
      --text-secondary: #f9f6e9;
      --text-tertiary: rgba(249,246,233,0.5);
      --radius: 10px;
      --radius-lg: 16px;
      --cat-bday-bg: #EEEAFF; --cat-bday-text: #5040CC; --cat-bday-border: #C4BAFF;
      --cat-anni-bg: #E6F1FB; --cat-anni-text: #185FA5; --cat-anni-border: #B5D4F4;
      --cat-etc-bg: #F1EFE8; --cat-etc-text: #5F5E5A; --cat-etc-border: #B4B2A9;
      --cat-event-bg: #FAEEDA; --cat-event-text: #854F0B; --cat-event-border: #FAC775;
      --cat-fandom-bg: #FBEAF0; --cat-fandom-text: #993556; --cat-fandom-border: #F4C0D1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #32322e; color: var(--text-primary); }

    /* ── 랜딩 섹션 ── */
    .landing { height: 100vh; background: #32322e; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }

    /* 배경 텍스트 */
    .landing-bg { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; user-select: none; }
    .lbg-line { font-size: clamp(64px, 10vw, 130px); font-weight: 900; color: rgba(0,0,0,0.05); letter-spacing: 6px; line-height: 0.88; white-space: nowrap; }

    /* Welcome 이미지 */
    .landing-welcome { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3; max-width: 52vw; width: auto; opacity: 0; transition: opacity 0.5s ease; }
    .landing-welcome.visible { opacity: 1; }

    /* 메인 콘텐츠 (푸밍 + 타이틀) */
    .landing-main { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 14px; opacity: 0; transform: translateY(16px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .landing-main.visible { opacity: 1; transform: translateY(0); }
    .landing-puming { height: clamp(160px, 20vw, 240px); width: auto; object-fit: contain; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .landing-title { font-size: clamp(32px, 4vw, 52px); font-weight: 900; color: var(--text-primary); letter-spacing: -1.5px; }
    .landing-title em { color: var(--laftel); font-style: normal; }
    .landing-logo { height: 48px; width: auto; object-fit: contain; opacity: 0.55; }
    .landing-start { display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; margin-top: 4px; }
    .landing-start-text { font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.12em; text-transform: uppercase; }
    .landing-start-arrow { width: 26px; height: 26px; border: 1px solid rgba(0,0,0,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-tertiary); animation: bounce 1.5s ease-in-out infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); opacity:0.5; } 50% { transform: translateY(4px); opacity:1; } }

    /* 하단 로고 바 */
    .intro-bottom-bar { display: flex; align-items: center; justify-content: center; gap: 24px; position: relative; z-index: 2; margin-top: 20px; }
    .intro-logo-main { height: 80px; width: auto; object-fit: contain; filter: invert(1) brightness(1.2); }
    .intro-deco { object-fit: contain; }
    .intro-deco-spiral { height: 60px; width: auto; filter: invert(1) opacity(0.5); transform: rotate(-15deg); }
    .intro-deco-star { height: 50px; width: auto; filter: brightness(1) opacity(0.6); }
    /* ── 캘린더 섹션 ── */
    .section-calendar { min-height: 100vh; padding: 32px 20px 60px; background: #32322e; }
    .top-bar { display: flex; justify-content: flex-end; margin-bottom: 16px; }
    .btn-logout { font-size: 11px; color: rgba(249,246,233,0.35); background: none; border: 1px solid rgba(249,246,233,0.15); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-family: inherit; text-decoration: none; }
    .btn-logout:hover { color: rgba(249,246,233,0.7); border-color: rgba(249,246,233,0.35); }

    /* ── 전체 레이아웃 ── */
    .app { max-width: 1480px; margin: 0 auto; display: flex; gap: 32px; align-items: flex-start; }

    /* ── 왼쪽 사이드바 ── */
    .sidebar { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }

    /* 사이드바 상단 — 날짜 카드 */
    .date-card { background: var(--laftel); border-radius: var(--radius-lg); padding: 28px 24px 0; position: relative; overflow: hidden; min-height: 360px; display: flex; flex-direction: column; }
    .date-card-bg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.15; pointer-events: none; }
    .date-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; position: relative; z-index: 1; }
    .date-card-logo { height: 40px; width: auto; object-fit: contain; filter: brightness(0) invert(1); opacity: 0.85; }
    .date-card-title { font-size: 11px; color: rgba(255,255,255,0.6); font-weight: 500; letter-spacing: 0.08em; }
    .date-day { font-size: 120px; font-weight: 900; color: #fff; line-height: 0.9; letter-spacing: -4px; position: relative; z-index: 1; }
    .date-weekday { font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.85); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 6px; position: relative; z-index: 1; }
    .date-full { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 4px; position: relative; z-index: 1; }
    .date-puming { width: 100%; display: flex; justify-content: flex-end; margin-top: auto; position: relative; z-index: 1; }
    .date-puming img { height: 110px; width: auto; object-fit: contain; }

    /* 사이드바 — 카테고리 필터 */
    .sidebar-cat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
    .sidebar-cat-title { font-size: 10px; font-weight: 600; color: var(--text-tertiary); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
    .sidebar-cat-list { display: flex; flex-direction: column; gap: 4px; }
    .cat-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--text-secondary); border: 1px solid transparent; transition: all 0.15s; font-family: inherit; background: none; width: 100%; text-align: left; }
    .cat-item:hover { background: #32322e; }
    .cat-item.active { font-weight: 500; }
    .cat-item[data-cat="전체"].active { background: var(--laftel-light); color: var(--laftel-text); border-color: var(--laftel-mid); }
    .cat-item[data-cat="캐릭터 생일"].active { background: var(--cat-bday-bg); color: var(--cat-bday-text); border-color: var(--cat-bday-border); }
    .cat-item[data-cat="방영 기념일"].active { background: var(--cat-anni-bg); color: var(--cat-anni-text); border-color: var(--cat-anni-border); }
    .cat-item[data-cat="팬덤 기념일"].active { background: var(--cat-fandom-bg); color: var(--cat-fandom-text); border-color: var(--cat-fandom-border); }
    .cat-item[data-cat="업계/시즌 이벤트"].active { background: var(--cat-event-bg); color: var(--cat-event-text); border-color: var(--cat-event-border); }
    .cat-item[data-cat="기타"].active { background: var(--cat-etc-bg); color: var(--cat-etc-text); border-color: var(--cat-etc-border); }
    .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* 사이드바 — D-Day 리스트 */
    .sidebar-dday { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
    .sidebar-dday-list { display: flex; flex-direction: column; gap: 4px; max-height: 280px; overflow-y: auto; }
    .dday-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--text-secondary); transition: background 0.15s; }
    .dday-item:hover { background: #32322e; }
    .dday-item-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; background: var(--laftel-light); color: var(--laftel-text); border: 1px solid var(--laftel-mid); min-width: 38px; text-align: center; flex-shrink: 0; }
    .dday-item-badge.today { background: var(--laftel); color: #fff; border-color: var(--laftel); }
    .dday-item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dday-empty { font-size: 12px; color: var(--text-tertiary); padding: 7px 10px; }

    /* ── 오른쪽 캘린더 ── */
    .main { flex: 1; min-width: 0; }

    /* 캘린더 컨트롤 */
    .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; position: relative; }
    .nav-wrap { display: flex; align-items: center; gap: 10px; }
    .nav-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-family: inherit; color: var(--text-secondary); cursor: pointer; }
    .nav-btn.active { background: var(--laftel); color: #fff; border-color: var(--laftel); }
    .nav-btn:hover { border-color: var(--laftel); color: var(--laftel); }
    .month-label { font-size: 22px; font-weight: 700; color: var(--text-primary); min-width: 120px; cursor: pointer; border-radius: 8px; padding: 4px 8px; transition: background 0.15s; }
    .month-label:hover { background: var(--laftel-light); color: var(--laftel); }
    /* 날짜 피커 */
    .date-picker { position: absolute; top: 44px; left: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); z-index: 100; width: 260px; }
    .dp-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .dp-year { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .dp-year-nav { background: none; border: 0.5px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .dp-year-nav:hover { border-color: var(--laftel); color: var(--laftel); }
    .dp-months { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .dp-month { font-size: 12px; padding: 7px 4px; border-radius: 6px; border: none; background: none; cursor: pointer; font-family: inherit; color: var(--text-secondary); text-align: center; transition: all 0.12s; }
    .dp-month:hover { background: var(--laftel-light); color: var(--laftel); }
    .dp-month.active { background: var(--laftel); color: #fff; font-weight: 500; }
    .right-controls { display: flex; gap: 8px; align-items: center; }
    .view-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .view-btn { background: none; border: none; padding: 6px 12px; font-size: 12px; font-family: inherit; color: var(--text-secondary); cursor: pointer; }
    .view-btn.active { background: var(--laftel); color: #fff; font-weight: 500; }
    .add-btn { background: var(--laftel); color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-size: 12px; font-family: inherit; font-weight: 500; cursor: pointer; }
    .add-btn:hover { background: var(--laftel-dark); }

    /* 캘린더 그리드 */
    .calendar-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .day-labels { display: grid; grid-template-columns: repeat(7,1fr); border-bottom: 1px solid var(--border); }
    .day-label { padding: 8px 0; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-tertiary); letter-spacing: 0.05em; text-transform: uppercase; }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); }
    .cell { min-height: 140px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px; overflow: visible; transition: background 0.1s; }
    .cell:nth-child(7n) { border-right: none; }
    .cell.clickable { cursor: pointer; }
    .cell.clickable:hover { background: var(--laftel-light); }
    .cell.other-month .date-num { color: var(--text-tertiary); }
    .cell.today .date-num { background: var(--laftel); color: #fff; border-radius: 50%; }
    .date-num { font-size: 12px; font-weight: 500; color: var(--text-secondary); width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; margin-bottom: 3px; }
    .chip { display: block; font-size: 12px; padding: 3px 6px; border-radius: 5px; margin-bottom: 3px; overflow: hidden; cursor: pointer; line-height: 1.4; }
    .chip:hover { filter: brightness(0.95); }
    .chip-name-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .chip-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
    .chip-badge-icon { height: 16px; width: auto; flex-shrink: 0; display: block; }
    .chip-title { display: inline-block; margin-top: 2px; font-size: 11px; padding: 2px 6px; border-radius: 20px; background: rgba(255,255,255,0.55); border: 0.5px solid rgba(0,0,0,0.08); color: #3f3d38; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .chip-more { font-size: 11px; font-weight: 600; color: var(--text-tertiary); padding: 3px 6px; margin-top: 1px; border-radius: 5px; cursor: pointer; }
    .chip-more:hover { color: var(--laftel); background: rgba(129,107,255,0.12); }
    .chip.캐릭터\ 생일 { background: var(--cat-bday-bg); color: var(--cat-bday-text); border: 0.5px solid var(--cat-bday-border); }
    .chip.방영\ 기념일 { background: var(--cat-anni-bg); color: var(--cat-anni-text); border: 0.5px solid var(--cat-anni-border); }
    .chip.기타 { background: var(--cat-etc-bg); color: var(--cat-etc-text); border: 0.5px solid var(--cat-etc-border); }
    .chip.업계\/시즌\ 이벤트 { background: var(--cat-event-bg); color: var(--cat-event-text); border: 0.5px solid var(--cat-event-border); }
    .chip.팬덤\ 기념일 { background: var(--cat-fandom-bg); color: var(--cat-fandom-text); border: 0.5px solid var(--cat-fandom-border); }

    /* 리스트 뷰 */
    .list-wrap { display: none; }
    .list-section-header { font-size: 12px; color: var(--text-tertiary); font-weight: 500; padding: 12px 0 8px; }
    .list-item { display: flex; align-items: center; gap: 14px; padding: 11px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; }
    .list-item:hover { border-color: var(--laftel-mid); }
    .list-date-badge { min-width: 44px; text-align: center; border-radius: 8px; padding: 6px 4px; }
    .list-date-day { font-size: 18px; font-weight: 600; line-height: 1; }
    .list-date-month { font-size: 10px; margin-top: 2px; }
    .list-info { flex: 1; }
    .list-char-name { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .list-title-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .list-actions { display: flex; gap: 6px; }
    .btn-sm { font-size: 11px; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-family: inherit; }
    .btn-outline { background: none; color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-outline:hover { border-color: var(--laftel); color: var(--laftel); }
    .detail-char-card .btn-outline { color: var(--laftel-text); border-color: var(--laftel); opacity: 0.7; }
    .detail-char-card .btn-outline:hover { opacity: 1; }
    .dday-badge { font-size: 10px; padding: 3px 7px; border-radius: 20px; background: var(--laftel-light); color: var(--laftel-text); border: 1px solid var(--laftel-mid); margin-left: 6px; vertical-align: middle; }
    .cat-tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }

    /* 모달 */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,26,46,0.4); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(129,107,255,0.15); animation: modal-in 0.2s ease; }
    @keyframes modal-in { from { opacity:0; transform:translateY(8px) scale(0.98); } to { opacity:1; transform:none; } }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
    .modal-title { font-size: 18px; font-weight: 700; color: var(--text-primary); }
    .modal-close { background: none; border: none; font-size: 18px; color: var(--text-tertiary); cursor: pointer; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 5px; display: block; }
    .form-input, .form-select { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; font-size: 13px; font-family: inherit; color: var(--text-primary); background: var(--surface); outline: none; }
    .form-input:focus, .form-select:focus { border-color: var(--laftel); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .btn-delete { font-size: 12px; color: #E24B4A; background: none; border: none; cursor: pointer; font-family: inherit; }
    .form-action-right { display: flex; gap: 8px; }
    .btn-cancel { font-size: 13px; padding: 8px 16px; border-radius: var(--radius); background: none; border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .btn-save { font-size: 13px; padding: 8px 20px; border-radius: var(--radius); background: var(--laftel); color: #fff; border: none; font-weight: 500; cursor: pointer; font-family: inherit; }
    .detail-chars { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .detail-char-card { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--laftel-light); border: 1px solid var(--laftel-mid); border-radius: var(--radius); }
    .detail-char-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: 600; flex-shrink: 0; }
    .detail-char-name { font-size: 14px; font-weight: 700; color: var(--laftel-text); }
    .detail-char-title { font-size: 11px; color: var(--laftel-dark); opacity: 0.75; margin-top: 2px; }
    .detail-actions { display: flex; flex-direction: column; gap: 8px; }
    .btn-notion { display: block; text-align: center; background: var(--laftel); color: #fff; border-radius: var(--radius); padding: 10px; font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; border: none; font-family: inherit; }
    .btn-laftel-link { display: block; text-align: center; background: none; color: var(--text-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px; font-size: 12px; text-decoration: none; cursor: pointer; font-family: inherit; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1A1A2E; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 200; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast.show { opacity: 1; }

    /* 배너 캘린더 호버 미리보기 */
    .banner-preview { position: fixed; z-index: 300; width: 240px; max-width: calc(100vw - 24px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; box-shadow: 0 8px 28px rgba(0,0,0,0.4); pointer-events: none; display: none; }
    .banner-preview-date { font-size: 11px; color: var(--laftel-mid); font-weight: 700; letter-spacing: 0.02em; margin-bottom: 6px; }
    .banner-preview-list { display: flex; flex-direction: column; gap: 5px; max-height: 220px; overflow-y: auto; }
    .banner-preview-item { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; color: var(--text-primary); line-height: 1.35; }
    .banner-preview-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
    .banner-preview-empty { font-size: 12px; color: var(--text-tertiary); }
    .banner-preview-loading { font-size: 12px; color: var(--text-tertiary); }
    .empty-state { text-align: center; padding: 40px 0; color: var(--text-tertiary); font-size: 14px; }
    .loading { text-align: center; padding: 40px 0; color: var(--text-tertiary); font-size: 13px; }

    /* ── 모바일 대응 (안 깨지는 수준) ── */
    @media (max-width: 720px) {
      .section-calendar { padding: 20px 12px 40px; }
      .app { flex-direction: column; gap: 16px; }
      .sidebar { width: 100%; }
      .date-card { min-height: 260px; padding: 20px 18px 0; }
      .date-day { font-size: 72px; letter-spacing: -2px; }
      .date-puming img { height: 80px; }
      .controls { flex-wrap: wrap; gap: 10px; }
      .nav-wrap { width: 100%; justify-content: space-between; }
      .month-label { min-width: 0; }
      .right-controls { width: 100%; flex-wrap: wrap; justify-content: flex-start; }
      .date-picker { left: 0; right: 0; width: auto; max-width: calc(100vw - 40px); }
      .cell { min-height: 96px; padding: 4px; }
      .date-num { font-size: 11px; width: 18px; height: 18px; margin-bottom: 2px; }
      .chip { font-size: 10px; padding: 2px 4px; margin-bottom: 2px; }
      .chip-title { font-size: 9px; padding: 1px 5px; margin-top: 1px; }
      .chip-more { font-size: 9px; padding: 2px 4px; }
      .day-label { font-size: 9px; padding: 6px 0; }
      .list-item { padding: 10px 12px; gap: 10px; }
      .modal { padding: 18px; }
    }
    @media (max-width: 420px) {
      .cell { min-height: 84px; }
      .chip-title { display: none; }
    }
  </style>
</head>

  // ── 배너(캐로절) 캘린더 연동: 날짜 호버 시 예정 배너 미리보기 ──
  const BANNER_API_URL = "https://script.google.com/macros/s/AKfycbzuB6EdRiOl_ecpf5g7tNOX85yzERRvBKRljkF0QFf-I7l0_n46J7cvlOJ0fxwt5PWSwA/exec";
  const BANNER_CAT_COLORS = { event:"#BA7517", live:"#D4537E", own:"#816BFF", store:"#378ADD", ad:"#5F5E5A", neutral:"#888780" };
  let BANNER_DATA = [];
  let bannerFetchKey = null;
  let bannerFetchPromise = null;

  async function loadBanners(year, month) {
    const key = `${year}-${month}`;
    if (bannerFetchKey === key) return; // 이미 이 달(±2개월 범위 포함) 데이터를 가지고 있음
    try {
      bannerFetchPromise = fetch(`${BANNER_API_URL}?action=getBanners&year=${year}&month=${month}`).then(r => r.json());
      const data = await bannerFetchPromise;
      BANNER_DATA = Array.isArray(data) ? data : [];
      bannerFetchKey = key;
    } catch (err) {
      console.warn("배너 캘린더 데이터를 불러오지 못했어요.", err);
    }
  }

  function getBannersForDate(dateStr) {
    return BANNER_DATA.filter(b => {
      const bs = (b.start_dt || "").slice(0, 10);
      const be = (b.end_dt || "").slice(0, 10);
      return bs && be && bs <= dateStr && dateStr <= be;
    }).sort((a, b) => (a.start_dt || "").localeCompare(b.start_dt || ""));
  }

  function showBannerPreview(ev, year, month, day) {
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const popup = document.getElementById("banner-preview");
    const dateEl = document.getElementById("banner-preview-date");
    const listEl = document.getElementById("banner-preview-list");
    dateEl.textContent = `${year}. ${month}. ${day} 배너 일정`;

    if (bannerFetchKey === null) {
      listEl.innerHTML = `<div class="banner-preview-loading">불러오는 중...</div>`;
    } else {
      const items = getBannersForDate(dateStr);
      listEl.innerHTML = !items.length
        ? `<div class="banner-preview-empty">예정된 배너가 없어요.</div>`
        : items.map(b => {
            const color = BANNER_CAT_COLORS[b.cat] || BANNER_CAT_COLORS.neutral;
            return `<div class="banner-preview-item"><span class="banner-preview-dot" style="background:${color};"></span><span>${b.name}</span></div>`;
          }).join("");
    }
    popup.style.display = "block";
    positionBannerPreview(ev);
  }

  function positionBannerPreview(ev) {
    const popup = document.getElementById("banner-preview");
    const gap = 14;
    const rect = popup.getBoundingClientRect();
    let x = ev.clientX + gap;
    let y = ev.clientY + gap;
    if (x + rect.width > window.innerWidth) x = ev.clientX - rect.width - gap;
    if (y + rect.height > window.innerHeight) y = ev.clientY - rect.height - gap;
    popup.style.left = Math.max(4, x) + "px";
    popup.style.top = Math.max(4, y) + "px";
  }

    document.getElementById("banner-preview").style.display = "none";

    document.getElementById("today-full").textContent = `${months[now.getMonth()]} ${now.getFullYear()}`;

  function filteredData() { return activeCat === "전체" ? DATA : DATA.filter(d => d.category === activeCat); }
  function getForDay(m, d) { return filteredData().filter(b => b.month === m && b.day === d); }
  function laftelUrl(id) { return `https://laftel.net/item/${id}`; }
  function getDays(y, m) { return new Date(y, m, 0).getDate(); }
  function isToday(y, m, d) { const t = new Date(); return t.getFullYear()===y && t.getMonth()+1===m && t.getDate()===d; }

  function makeNotionUrl(items) {
    const first = items[0];
    const title = items.length===1 ? `${first.name} 이벤트` : `${first.name} 외 ${items.length-1}개 이벤트`;
    const params = new URLSearchParams({"이벤트명":title,"캐릭터":items.map(b=>b.name).join(", "),"작품명":[...new Set(items.map(b=>b.title))].join(", "),"라프텔 링크":first.laftel_id?laftelUrl(first.laftel_id):"",'상태':"아이디어"});
    return `${NOTION_DB_URL}?${params.toString()}`;
  }

  function renderCalendar() {
    const monthKo = ["","1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];

    const grid = document.getElementById("cal-grid");
    grid.innerHTML = "";
    const firstDay = new Date(curYear, curMonth-1, 1).getDay();
    const daysInMonth = getDays(curYear, curMonth);
    const prevDays = getDays(curYear, curMonth===1?12:curMonth-1);
    const total = Math.ceil((firstDay+daysInMonth)/7)*7;

    for (let i = 0; i < total; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      let day, month = curMonth, year = curYear, isOther = false;
      if (i < firstDay) { day=prevDays-firstDay+1+i; month=curMonth===1?12:curMonth-1; year=curMonth===1?curYear-1:curYear; isOther=true; cell.classList.add("other-month"); }
      else if (i >= firstDay+daysInMonth) { day=i-firstDay-daysInMonth+1; month=curMonth===12?1:curMonth+1; year=curMonth===12?curYear+1:curYear; isOther=true; cell.classList.add("other-month"); }
      else { day=i-firstDay+1; }
      if (isToday(curYear,curMonth,day) && !isOther) cell.classList.add("today");
      const dn = document.createElement("div");
      dn.className = "date-num"; dn.textContent = day; cell.appendChild(dn);
      if (!isOther) {
        const items = getForDay(month, day);
        if (items.length) {
          cell.classList.add("clickable");
          cell.addEventListener("click", (e) => { if (e.target===cell||e.target===dn) openDetail(month,day); });
          items.forEach(b => {
            const chip = document.createElement("div");
            chip.className = `chip ${b.category}`;
            chip.innerHTML = `<div class="chip-name-row"><span class="chip-name">${b.name}</span>${categoryBadgeImg(b)}</div>${b.title?`<span class="chip-title">${b.title}</span>`:''}`;
            chip.addEventListener("click", (e) => { e.stopPropagation(); openDetail(month, day); });
            cell.appendChild(chip);
          });
        }
        cell.addEventListener("click", (e) => { if (e.target===cell||e.target===dn) { if (!items.length) openAddModal(month,day); } });
        if (!items.length) cell.classList.add("clickable");
      }
      // 배너 캘린더 호버 미리보기 (모든 셀에 적용 — 이전/다음 달 셀 포함)
      cell.addEventListener("mouseenter", (e) => showBannerPreview(e, year, month, day));
      cell.addEventListener("mousemove", (e) => positionBannerPreview(e));
      cell.addEventListener("mouseleave", hideBannerPreview);
      grid.appendChild(cell);
    }
  }

  function renderList() {
    const monthKo = ["","1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
    document.getElementById("month-label").textContent = `${curYear}년 ${monthKo[curMonth]}`;
    const container = document.getElementById("list-container");
    container.innerHTML = "";
    const today = new Date(); const tm=today.getMonth()+1, td=today.getDate();

    function renderItem(b) {
      const col = CAT_COLORS[b.category]||CAT_COLORS["기타"];
      const dday = (b.month===tm&&b.day>=td)?b.day-td:null;
      const ddayHtml = dday!==null?`<span class="dday-badge">${dday===0?"오늘!":"D-"+dday}</span>`:"";
      const item = document.createElement("div"); item.className="list-item";
      item.innerHTML=`<div class="list-date-badge" style="background:${col.bg};"><div class="list-date-day" style="color:${col.text};">${b.day}</div><div class="list-date-month" style="color:${col.text};">${monthKo[b.month]}</div></div><div class="list-info"><div class="list-char-name">${b.name}${ddayHtml}</div><div class="list-title-sub">${b.title||""}</div></div><div class="list-actions"><button class="btn-sm btn-outline" onclick="openEdit(DATA.find(d=>d.rowIndex===${b.rowIndex}))">수정</button></div>`;
      return item;
    }

    if (showAllMonths) {
      const all = filteredData().slice().sort((a,b)=> a.month-b.month || a.day-b.day);
      if (!all.length) { container.innerHTML = `<div class="empty-state">등록된 항목이 없습니다.</div>`; return; }
      let curM = null;
      all.forEach(b => {
        if (b.month !== curM) {
          curM = b.month;
          const count = all.filter(x=>x.month===curM).length;
          const hdr = document.createElement("div"); hdr.className="list-section-header"; hdr.textContent=`${monthKo[curM]} · ${count}개`;
          container.appendChild(hdr);
        }
        container.appendChild(renderItem(b));
      });
      return;
    }

    const list = filteredData().filter(b=>b.month===curMonth).sort((a,b)=>a.day-b.day);
    const hdr = document.createElement("div"); hdr.className="list-section-header"; hdr.textContent=`${monthKo[curMonth]} · ${list.length}개`; container.appendChild(hdr);
    if (!list.length) { container.innerHTML+=`<div class="empty-state">이 달의 항목이 없습니다.</div>`; return; }
    list.forEach(b => container.appendChild(renderItem(b)));
  }

  let detailMonth = null, detailDay = null;

  function openAddFromDetail() {
    closeDetail();
    openAddModal();
    // 날짜 자동 입력
    if (detailMonth !== null) {
      setTimeout(() => {
        const mEl = document.getElementById('inp-month');
        const dEl = document.getElementById('inp-day');
        if (mEl) mEl.value = detailMonth;
        if (dEl) dEl.value = detailDay;
      }, 50);
    }
  }

  function openDetail(month, day) {
    detailMonth = month; detailDay = day;
    const items = getForDay(month, day);
    if (!items.length) { openAddFromDetail(); return; }
    document.getElementById("detail-date").textContent = `${curYear}년 ${month}월 ${day}일`;
    document.getElementById("detail-title").textContent = items.length===1?`${items[0].name}`:`${items.length}개 항목`;
    const chars = document.getElementById("detail-chars"); chars.innerHTML="";
    items.forEach(b => {
      const col = CAT_COLORS[b.category]||CAT_COLORS["기타"];
      const card = document.createElement("div"); card.className="detail-char-card";
      card.style.background=col.bg; card.style.borderColor=col.border;
      card.innerHTML=`<div style="display:flex;align-items:center;gap:10px;"><div class="detail-char-icon" style="background:${col.icon};">${b.name[0]}</div><div><div class="detail-char-name">${b.name}</div><div class="detail-char-title">${b.title||b.category}</div></div></div><button class="btn-sm btn-outline" onclick="openEdit(DATA.find(d=>d.rowIndex===${b.rowIndex}));closeDetail();">수정</button>`;
      chars.appendChild(card);
    });
    document.getElementById("detail-notion-btn").href=makeNotionUrl(items);
    document.getElementById("detail-laftel-btn").href=items[0].laftel_id?laftelUrl(items[0].laftel_id):"#";
    document.getElementById("detail-overlay").classList.add("open");
  }
  function closeDetail() { document.getElementById("detail-overlay").classList.remove("open"); }
  function closeDetailBg(e) { if (e.target===document.getElementById("detail-overlay")) closeDetail(); }

  function openAddModal(month, day) {
    editingItem=null;
    document.getElementById("form-title").textContent="새 항목 추가";
    document.getElementById("form-delete-btn").style.display="none";
    ["f-name","f-title","f-laftel-id","f-memo"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("f-month").value=month||"";
    document.getElementById("f-day").value=day||"";
    document.getElementById("f-category").value="캐릭터 생일";
    document.getElementById("form-overlay").classList.add("open");
  }
  function openEdit(item) {
    if (!item) return; editingItem=item;
    document.getElementById("form-title").textContent="항목 수정";
    document.getElementById("form-delete-btn").style.display="block";
    document.getElementById("f-name").value=item.name;
    document.getElementById("f-title").value=item.title||"";
    document.getElementById("f-month").value=item.month;
    document.getElementById("f-day").value=item.day;
    document.getElementById("f-laftel-id").value=item.laftel_id||"";
    document.getElementById("f-memo").value=item.memo||"";
    document.getElementById("f-category").value=item.category;
    document.getElementById("form-overlay").classList.add("open");
  }
  function closeForm() { document.getElementById("form-overlay").classList.remove("open"); }
  function closeFormBg(e) { if (e.target===document.getElementById("form-overlay")) closeForm(); }

  async function saveItem() {
    const body = { name:document.getElementById("f-name").value.trim(), title:document.getElementById("f-title").value.trim(), month:parseInt(document.getElementById("f-month").value), day:parseInt(document.getElementById("f-day").value), laftel_id:document.getElementById("f-laftel-id").value.trim(), category:document.getElementById("f-category").value, memo:document.getElementById("f-memo").value.trim() };
    if (!body.name||!body.month||!body.day) { showToast("이름, 월, 일은 필수예요!"); return; }
    try {
      if (editingItem) { await fetch(API_URL,{method:"POST",body:JSON.stringify({_method:"PUT",...body,rowIndex:editingItem.rowIndex})}); const idx=DATA.findIndex(d=>d.rowIndex===editingItem.rowIndex); if(idx!==-1)DATA[idx]={...editingItem,...body}; showToast("수정됐어요!"); }
      else { await fetch(API_URL,{method:"POST",body:JSON.stringify({_method:"POST",...body})}); DATA.push({...body,rowIndex:Date.now()}); showToast("추가됐어요!"); }
    } catch(e) {
      if(editingItem){const idx=DATA.findIndex(d=>d.rowIndex===editingItem.rowIndex);if(idx!==-1)DATA[idx]={...editingItem,...body};showToast("수정됐어요! (미연결)");}
      else{DATA.push({...body,rowIndex:Date.now()});showToast("추가됐어요! (미연결)");}
    }
    closeForm(); render();
  }

  async function deleteItem() {
    if (!editingItem||!confirm(`"${editingItem.name}"을 삭제할까요?`)) return;
    try { await fetch(API_URL,{method:"POST",body:JSON.stringify({_method:"DELETE",rowIndex:editingItem.rowIndex})}); } catch(e) {}
    DATA=DATA.filter(d=>d.rowIndex!==editingItem.rowIndex); closeForm(); showToast("삭제됐어요!"); render();
  }

  function showToast(msg) { const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2500); }
  function changeMonth(dir) { curMonth+=dir; if(curMonth>12){curMonth=1;curYear++;} if(curMonth<1){curMonth=12;curYear--;} render(); }
  function goToday() {
    const today = new Date();
    curYear = today.getFullYear();
    curMonth = today.getMonth() + 1;
    render();
  }

  function setView(v) { viewMode=v; document.getElementById("btn-cal").classList.toggle("active",v==="cal"); document.getElementById("btn-list").classList.toggle("active",v==="list"); document.getElementById("cal-view").style.display=v==="cal"?"block":"none"; document.getElementById("list-view").style.display=v==="list"?"block":"none"; document.getElementById("btn-all-months").style.display=v==="list"?"inline-block":"none"; render(); }
  function toggleAllMonths() { showAllMonths=!showAllMonths; document.getElementById("btn-all-months").classList.toggle("active",showAllMonths); document.getElementById("btn-all-months").textContent=showAllMonths?"이번 달만":"전체보기"; renderList(); }
  function renderDdayList() {
    const container = document.getElementById("dday-list");
    if (!container) return;
    container.innerHTML = "";
    const today = new Date();
    const tm = today.getMonth() + 1, td = today.getDate();
    const list = filteredData()
      .filter(b => b.month === tm && b.day >= td)
      .sort((a, b) => a.day - b.day);

    if (!list.length) {
      container.innerHTML = `<div class="dday-empty">이번 달 남은 이벤트가 없어요.</div>`;
      return;
    }
    list.forEach(b => {
      const dday = b.day - td;
      const row = document.createElement("div");
      row.className = "dday-item";
      const badgeText = dday === 0 ? "D-DAY" : `D-${dday}`;
      row.innerHTML = `<span class="dday-item-badge${dday===0?' today':''}">${badgeText}</span><span class="dday-item-name">${displayName(b)}</span>`;
      row.addEventListener("click", () => openDetail(b.month, b.day));
      container.appendChild(row);
    });
  }

  function render() {
    const today = new Date();
    const isToday = curYear === today.getFullYear() && curMonth === today.getMonth() + 1;
    const btnToday = document.getElementById('btn-today');
    if (btnToday) btnToday.style.opacity = isToday ? '0.35' : '1';
    viewMode==="cal"?renderCalendar():renderList();
    renderDdayList();
    loadBanners(curYear, curMonth);
  }

  setTodayInfo();
  loadData();
</script>
</body>
</html>
