<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — 애니버서리 캘린더</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #32322e;
      color: #f9f6e9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #3e3e39;
      border: 1px solid rgba(249,246,233,0.12);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo { font-size: 13px; font-weight: 600; color: rgba(249,246,233,0.4); letter-spacing: 0.1em; margin-bottom: 8px; }
    .title { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 6px; }
    .title em { color: #816BFF; font-style: normal; }
    .subtitle { font-size: 12px; color: rgba(249,246,233,0.5); margin-bottom: 32px; }
    .input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(249,246,233,0.07);
      border: 1px solid rgba(249,246,233,0.15);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      color: #f9f6e9;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .input:focus { border-color: #816BFF; }
    .input::placeholder { color: rgba(249,246,233,0.3); }
    .btn {
      width: 100%;
      padding: 13px;
      background: #816BFF;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .error-msg {
      background: rgba(226,75,74,0.15);
      border: 1px solid rgba(226,75,74,0.3);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      color: #f28b8a;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">LAFTEL</div>
    <div class="title">애니버서리 <em>캘린더</em></div>
    <div class="subtitle">라프텔 구성원만 접근할 수 있어요</div>

    <div class="error-msg" id="error-msg">비밀번호가 틀렸어요</div>

    <input class="input" type="password" id="pw-input" placeholder="비밀번호 입력" />
    <button class="btn" onclick="tryLogin()">입장하기</button>
  </div>

  <script>
    // 엔터키로도 로그인
    document.getElementById('pw-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') tryLogin();
    });

    function tryLogin() {
      const pw = document.getElementById('pw-input').value;
      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      }).then(r => {
        if (r.ok) {
          location.href = '/';
        } else {
          document.getElementById('error-msg').classList.add('show');
          document.getElementById('pw-input').value = '';
          document.getElementById('pw-input').focus();
        }
      });
    }
  </script>
</body>
</html>
