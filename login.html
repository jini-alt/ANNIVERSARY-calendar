<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — 애니버서리 캘린더</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #32322e;
      color: #f9f6e9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #3e3e39;
      border: 1px solid rgba(249,246,233,0.12);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo { font-size: 13px; font-weight: 600; color: rgba(249,246,233,0.4); letter-spacing: 0.1em; margin-bottom: 8px; }
    .title { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 6px; }
    .title em { color: #816BFF; font-style: normal; }
    .subtitle { font-size: 12px; color: rgba(249,246,233,0.5); margin-bottom: 36px; }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 20px;
      background: #fff;
      color: #3c3c3c;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn-google:hover { opacity: 0.9; }
    .note { font-size: 11px; color: rgba(249,246,233,0.3); margin-top: 18px; }
    .error-msg {
      background: rgba(226,75,74,0.15);
      border: 1px solid rgba(226,75,74,0.3);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      color: #f28b8a;
      margin-bottom: 20px;
      display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">LAFTEL</div>
    <div class="title">애니버서리 <em>캘린더</em></div>
    <div class="subtitle">라프텔 구성원만 접근할 수 있어요</div>

    <div class="error-msg" id="error-msg">
      @laftel.net 계정으로만 로그인할 수 있어요
    </div>

    <a class="btn-google" href="/api/auth/start">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.20455C17.64 8.56636 17.5827 7.95273 17.4764 7.36364H9V10.845H13.8436C13.635 11.97 13.0009 12.9232 12.0477 13.5614V15.8195H14.9564C16.6582 14.2527 17.64 11.9455 17.64 9.20455Z" fill="#4285F4"/>
        <path d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5614C11.2418 14.1014 10.2109 14.4204 9 14.4204C6.65591 14.4204 4.67182 12.8373 3.96409 10.71H0.957275V13.0418C2.43818 15.9832 5.48182 18 9 18Z" fill="#34A853"/>
        <path d="M3.96409 10.71C3.78409 10.17 3.68182 9.59318 3.68182 9C3.68182 8.40682 3.78409 7.83 3.96409 7.29V4.95818H0.957275C0.347727 6.17318 0 7.54773 0 9C0 10.4523 0.347727 11.8268 0.957275 13.0418L3.96409 10.71Z" fill="#FBBC05"/>
        <path d="M9 3.57955C10.3214 3.57955 11.5077 4.03364 12.4405 4.92545L15.0218 2.34409C13.4632 0.891818 11.4259 0 9 0C5.48182 0 2.43818 2.01682 0.957275 4.95818L3.96409 7.29C4.67182 5.16273 6.65591 3.57955 9 3.57955Z" fill="#EA4335"/>
      </svg>
      Google로 로그인
    </a>

    <div class="note">@laftel.net 계정으로만 로그인 가능해요</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('error') === 'unauthorized_domain') {
      document.getElementById('error-msg').classList.add('show');
    }
  </script>
</body>
</html>
